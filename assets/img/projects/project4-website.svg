  <text x="250" y="215" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="url(#gold)">Mahammad.</text>
  <rect x="120" y="240" width="300" height="10" rx="5" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="120" y="260" width="260" height="10" rx="5" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="120" y="295" width="120" height="34" rx="17" fill="#f6c453"/>
  <rect x="252" y="295" width="120" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>
