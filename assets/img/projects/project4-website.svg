  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- browser window -->
  <rect x="90" y="50" width="620" height="350" rx="16" fill="#0b0e18" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
