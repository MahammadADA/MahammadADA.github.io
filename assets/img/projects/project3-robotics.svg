<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a robot drawing shapes, for the upcoming robotics project">
  <!-- Illustration only. Replace with real photos once the project is done. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10262a"/>
      <stop offset="1" stop-color="#0b0e18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- path traced by the robot -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 12">
    <rect x="90" y="90" width="200" height="200" stroke="#5fe3d0"/>
    <path d="M440 300L540 110L640 300Z" stroke="#f6c453"/>
  </g>
  <!-- robot -->
  <g transform="translate(560 300)">
    <rect x="-60" y="-50" width="120" height="80" rx="12" fill="#1d2442" stroke="#e8ebf5" stroke-width="4"/>
    <rect x="-38" y="-30" width="76" height="34" rx="6" fill="#0b0e18"/>
    <circle cx="-16" cy="-13" r="7" fill="#5fe3d0"/>
    <circle cx="16" cy="-13" r="7" fill="#5fe3d0"/>
    <rect x="-75" y="12" width="30" height="42" rx="8" fill="#e8ebf5"/>
    <rect x="45" y="12" width="30" height="42" rx="8" fill="#e8ebf5"/>
    <rect x="-6" y="-78" width="12" height="28" fill="#e8ebf5"/>
    <circle cx="0" cy="-82" r="9" fill="#f6c453"/>
  </g>
  <text x="90" y="380" font-family="Courier New, monospace" font-size="26" fill="#a1a9c4">square → triangle → ...</text>
</svg>
